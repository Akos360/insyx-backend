services:
  postgres:
    image: postgres:16
    container_name: insyx-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-insyx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insyx}
      POSTGRES_DB: ${DB_NAME:-insyx}
    ports:
      # Host-side port only; changing this does not affect the backend container,
      # which always reaches Postgres at postgres:5432 over the internal Docker network.
      # Default moved off 5432 — insyx-database's own Postgres also claims 5432 on the host.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insyx-backend
    depends_on:
      - postgres
    environment:
      PORT: ${PORT:-3000}
      # Both hostnames are listed since "localhost" resolves to ::1 on this
      # machine (see TRINO_HOST comment below) — depending on which one the
      # frontend is actually opened at, the browser's Origin header differs,
      # and a credentialed cross-origin request (cookies) needs an exact match.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-insyx}
      DB_PASSWORD: ${DB_PASSWORD:-insyx}
      DB_NAME: ${DB_NAME:-insyx}
      # insyx-database's Trino runs on the host (a separate docker-compose project),
      # not on this network — host.docker.internal is Docker Desktop's alias for the
      # host machine. 127.0.0.1 here would point at this container itself.
      TRINO_HOST: http://host.docker.internal:8080
      TRINO_CATALOG: ${TRINO_CATALOG:-iceberg}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-scisci}
      TRINO_USER: ${TRINO_USER:-insyx-backend}
      # Signs access/refresh JWTs — override with a real random string via
      # your own .env for anything beyond local dev.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-any-real-deployment}
      # Used to build password-reset links (see AuthService.requestPasswordReset).
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8081}
      # Google OAuth Client ID (Identity Services ID-token flow — no secret
      # needed). Placeholder until a real one is created; see the plan notes
      # for how. Sign-in with Google won't work until this is a real value.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured.apps.googleusercontent.com}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
