services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insyx-backend
    environment:
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      TRINO_HOST: ${TRINO_HOST:-http://host.docker.internal:8080}
      TRINO_USER: ${TRINO_USER:-backend}
      TRINO_CATALOG: ${TRINO_CATALOG:-iceberg}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-scisci}
    ports:
      - "${PORT:-3000}:3000"
